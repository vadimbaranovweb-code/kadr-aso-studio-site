<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="connect-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="theme-color" content="#F6F8FB">
  <title>Скринпак — бесплатный редактор скриншотов для приложений</title>
  <meta name="description" content="Скринпак — бесплатный редактор скриншотов для App Store, Google Play и RuStore. Загрузите экраны, настройте мокапы, фон и текст, скачайте комплект без водяного знака.">
  <link rel="icon" type="image/svg+xml" href="./assets/brands/screenpack.svg">
  <link rel="stylesheet" href="./mvp/style.css">
  <link rel="stylesheet" href="./mvp/workspace.css">
  <script type="module" src="./mvp/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="./" class="brand" aria-label="Скринпак — главная"><img class="brand-mark" src="./assets/brands/screenpack.svg" width="28" height="28" alt="">скринпак<span class="version">Free · 0.12.0</span></a>
    <span id="save-status" class="save-status" aria-live="polite">Открываем проект…</span>
    <div class="header-actions"><button id="open-project" class="button quiet">Открыть проект</button><button id="save-project" class="button quiet" hidden>Сохранить проект</button><button id="new-project" class="button quiet" hidden>Новый</button></div>
  </header>
  <main id="app" aria-busy="true"><div class="initial-loading">Открываем Скринпак…</div></main>
  <div id="notice" class="notice" role="status" hidden></div>
  <input id="screens-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
  <input id="project-input" type="file" accept=".json,.kadr.json,application/json" hidden>
  <dialog id="message-dialog"><h2 id="dialog-title"></h2><p id="dialog-body"></p><div id="dialog-extra"></div><div class="dialog-actions"><button id="dialog-cancel" class="button">Отмена</button><button id="dialog-confirm" class="button primary">Продолжить</button></div></dialog>
  <dialog id="color-dialog" class="color-dialog" aria-labelledby="color-title"><header title="Перетащите палитру"><h2 id="color-title">Цвет</h2><button type="button" class="button quiet" data-close-color aria-label="Закрыть палитру">✕</button></header><div id="color-content"></div></dialog>
  <noscript>Для редактора нужен JavaScript. Включите его в настройках браузера.</noscript>
</body>
</html>
